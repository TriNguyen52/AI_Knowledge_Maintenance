[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-knowledge-maintenance"
version = "0.1.0"
description = "Agentic knowledge maintenance system — uses CockroachDB as persistent memory and AWS Bedrock for LLM reasoning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Jacks"}]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "markdown-it-py>=3.0.0",
    "apache-burr>=0.42.0",
    "groq>=0.11.0",
    "boto3>=1.34.0",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]
aws = [
    "boto3>=1.34.0",
]
cockroach = [
    "psycopg2-binary>=2.9.0",
]

[project.scripts]
ai-ready = "ai_ready.cli:app"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
